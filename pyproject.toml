[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance_risk_analyzer"
version = "0.1.0"
description = "Advanced Insurance Risk Analysis and Prediction System"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core web framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.21",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",  # For PostgreSQL
    "aiosqlite>=0.19.0",  # For SQLite

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",

    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.43.0",

    # ML Ops
    "mlflow>=2.7.1",
    "prometheus-client>=0.18.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "python-json-logger>=2.0.7",

    # Utilities
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "typing-extensions>=4.8.0",
    "loguru>=0.7.2",  # Enhanced logging
]

[project.urls]
Homepage = "https://github.com/yourusername/insurance-risk-analyzer"
Documentation = "https://github.com/yourusername/insurance-risk-analyzer#readme"
Issues = "https://github.com/yourusername/insurance-risk-analyzer/issues"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "pytest-env>=0.8.1",
    "pytest-sugar>=0.9.7",
    "pytest-html>=4.1.1",
    "pytest-faker>=16.3.0",
    "pytest-randomly>=3.15.0",
    "pytest-testmon>=2.0.4",
    "pytest-timeout>=2.2.0",
    
    # Code quality
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "ruff>=0.1.9",
    "pre-commit>=3.5.0",
    "safety>=2.3.5",
    "bandit>=1.7.5",
    
    # Documentation
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-markdown-tables>=0.0.17",
    
    # Development tools
    "jupyter>=1.0.0",
    "ipython>=8.18.0",
    "ipdb>=0.13.13",
    "pylint>=3.0.3",
    "pylint-pydantic>=0.3.0",
    "pylint-pytest>=1.1.2",
    "mypy-extensions>=1.0.0",
    "types-python-dateutil>=2.8.19.14",
    "types-requests>=2.31.0.1",
    "types-pyyaml>=6.0.12.10",
    
    # Test data and mocks
    "factory-boy>=3.3.0",
    "faker>=19.6.1",
    "freezegun>=1.4.0",
    "httpx>=0.26.0",
    "respx>=0.20.2",
    "aiohttp>=3.9.0",
    "aioresponses>=0.7.0",
    "pytest-httpx>=0.27.0",
    "pytest-aiohttp>=1.0.0",
    "pytest-mock-resources>=2.10.1"
]

docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.20.0",
]

ui = [
    # Streamlit UI stack
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
ira-api = "app.main:app"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["**/__init__.py", "**/tests/**"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
