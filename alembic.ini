# Alembic configuration for Insurance Risk Analyzer
# This file is used by the Alembic migration tool to manage database migrations.
# It should not be committed to version control with sensitive information.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
revision_environment = true

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
sourceless = false

# Version location specification
version_path_separator = _

# Output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

# Database configuration
[db]
# This section is not used directly by Alembic, but can be used by your application
# to determine the database URL. The actual database URL is set via environment variables.

# SQLAlchemy database URL
# This will be overridden by the DATABASE_URL environment variable
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# Environment variable configuration
# These environment variables will be used to construct the database URL
# if sqlalchemy.url is not set directly in this file.
#
# Example:
#   export DB_DRIVER=postgresql
#   export DB_USER=postgres
#   export DB_PASSWORD=yourpassword
#   export DB_HOST=localhost
#   export DB_PORT=5432
#   export DB_NAME=insurance_risk
#
# The database URL will be constructed as:
#   {DB_DRIVER}://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}

# Uncomment and modify the following lines to set default values
# [alembic:vars]
# db_driver = postgresql
# db_user = postgres
# db_password = postgres
# db_host = localhost
# db_port = 5432
# db_name = insurance_risk
