[metadata]
description-file = README.md
license_files = LICENSE

[flake8]
max-line-length = 88
extend-ignore =
    # See https://github.com/psf/black/issues/315
    E203,
    # Allow non-breaking space for markdown
    W291
per-file-ignores =
    # Allow unused imports in __init__.py
    __init__.py: F401
    # Allow star imports in tests
    tests/*: F403,F405,F811
    # Allow redefinition of names in tests
    tests/*: F811
    # Allow unused arguments in tests
    tests/*: ARG001,ARG002,ARG003
    # Allow unused variables in tests
    tests/*: F841
    # Allow magic numbers in tests
    tests/*: B905
    # Allow broad except in tests
    tests/*: B902,B904
    # Allow assert in tests
    tests/*: S101
    # Allow print in tests
    tests/*: T201
    # Allow too many statements in tests
    tests/*: C901
    # Allow too many arguments in tests
    tests/*: PLR0913
    # Allow too many locals in tests
    tests/*: PLR0914
    # Allow too many branches in tests
    tests/*: PLR0912
    # Allow too many statements in tests
    tests/*: PLR0915
    # Allow too many return statements in tests
    tests/*: PLR0911
    # Allow too many arguments in tests
    tests/*: PLR0913
    # Allow too many locals in tests
    tests/*: PLR0914
    # Allow too many branches in tests
    tests/*: PLR0912
    # Allow too many statements in tests
    tests/*: PLR0915
    # Allow too many return statements in tests
    tests/*: PLR0911

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
known_first_party = app

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Ignore missing imports for third-party packages
[mypy-alembic.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[coverage:run]
source = app
branch = True
omit =
    */tests/*
    */migrations/*
    */__init__.py

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 80

exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code:
    def __repr__
    if self\.debug
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    raise NotImplementedError
    @(abc\.)?abstractmethod
    @pytest\.mark\.skip
    @pytest\.mark\.skipif
    @pytest\.mark\.xfail
    @pytest\.fixture
    @pytest\.mark\.parametrize

[coverage:html]
directory = htmlcov

[tool:pytest]
testpaths = tests
addopts = -v -s --cov=app --cov-report=term-missing --cov-report=html
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning

[egg_info]
tag_build =
tag_date = 0
